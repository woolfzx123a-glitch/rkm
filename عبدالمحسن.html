<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقنية رقمية - واجهة الاختراق</title>
    <style>
        /* إعدادات الخلفية السوداء والخطوط المتوهجة */
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* لوحة البيانات الشفافة */
        .container {
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #0f0;
            box-shadow: 0 0 20px #0f0;
            text-align: center;
            z-index: 10;
            max-width: 500px;
            width: 90%;
        }

        /* تأثير التوهج للنصوص */
        h1, p {
            text-shadow: 0 0 8px #0f0;
            margin: 15px 0;
        }

        /* تصميم زر الهكر الاحترافي */
        button {
            background-color: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 10px 25px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            border-radius: 5px;
            text-shadow: 0 0 5px #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        /* تجهيز مساحة أرقام الماتريكس في الخلفية */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- خلفية أرقام الهكر المتساقطة -->
    <canvas id="matrixCanvas"></canvas>

    <!-- محتوى الصفحة داخل لوحة التحكم -->
    <div class="container">
        <h1>[ تم اختراق النظام بنجاح ]</h1>
        <p>الطالب الفني: عبدالمحسن موسى</p>
        
        <script>
            document.write("<p>الشعبة: الثاني ثانوي - 6</p>");
        </script>

        <p id="g_id">حالة النظام: مراقبة</p>

        <button onclick="myfunction()">تفعيل بروتوكول الحماية</button>
    </div>

    <script>
        // دالة تغيير النص عند الضغط على الزر
        function myfunction() {
            document.getElementById("g_id").innerHTML = "تم تشغيل جدار الحماية الناري الخارق!";
            document.getElementById("g_id").style.color = "#ff0055";
            document.getElementById("g_id").style.textShadow = "0 0 10px #ff0055";
        }

        // كود تأثير تساقط الأرقام (Matrix Rain Effect)
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        const draw = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        setInterval(draw, 30);

        // تحديث الحجم عند تكبير أو تصغير المتصفح
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
